[package]
name = "c2pa-vtt"
version = "0.2.0"
edition = "2021"
# One MSRV across the crate family; verified with `cargo +1.87 check`.
rust-version = "1.87"
description = "C2PA manifest embedding and hard binding for WebVTT subtitle and caption files"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/writerslogic/c2pa-vtt"
keywords = ["c2pa", "provenance", "webvtt", "subtitles", "captions"]
categories = ["encoding", "parser-implementations"]

# `cdylib` is what wasm-pack and maturin need to produce a loadable module;
# `rlib` keeps the crate usable as an ordinary Rust dependency.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["hash"]
# Python bindings, built with maturin/PyO3 for the PyPI distribution.
python = ["dep:pyo3", "hash"]
# sha2-backed c2pa.hash.data compute/verify. Disable for a zero-dependency
# embed/extract build.
hash = ["dep:sha2"]
# Validation bridge that delegates signature/trust/assertion checks to c2pa-rs.
c2pa = ["dep:c2pa", "hash"]

[dependencies]
# Reuses c2pa-structured-text's manifest-armour primitives (base64, delimiters,
# exclusion hashing). A version requirement, not a git dependency: a git
# dependency makes a crate permanently unpublishable to crates.io.
# 0.3 is the first published version exporting `codec`, `hardbinding`, and the
# delimiter constants this crate builds on; 0.2.0 predates them, which is why
# this was a git pin. Publish c2pa-structured-text 0.3.0 before this crate.
c2pa-structured-text = { version = "0.3", default-features = false }
sha2 = { version = "0.10", optional = true }
c2pa = { version = "0.89", optional = true, default-features = false, features = [
    "rust_native_crypto",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3 = { version = "0.25", optional = true, features = ["extension-module", "abi3-py39"] }

# The npm distribution is a `wasm32` build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
